<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Splitpool — Acesso Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Nunito:wght@700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
:root{--blue:#1255CC;--bluedark:#0A3080;--teal:#00C8D7;}
body{font-family:'Inter',sans-serif;min-height:100vh;background:linear-gradient(135deg,#0A3080 0%,#1255CC 60%,#00C8D7 100%);display:flex;align-items:center;justify-content:center;padding:20px;}
.box{background:#fff;border-radius:20px;padding:40px 36px;width:100%;max-width:380px;box-shadow:0 24px 64px rgba(0,0,0,0.3);}
.logo{font-family:'Nunito',sans-serif;font-size:24px;font-weight:900;color:var(--blue);text-align:center;margin-bottom:6px;}
.logo span{color:var(--teal);}
.badge{display:block;background:#0A3080;color:#fff;font-size:10px;font-weight:800;padding:3px 10px;border-radius:8px;letter-spacing:.08em;width:fit-content;margin:0 auto 28px;}
.title{font-size:18px;font-weight:800;color:var(--bluedark);text-align:center;margin-bottom:4px;}
.sub{font-size:13px;color:var(--bluedark);opacity:.45;text-align:center;margin-bottom:28px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:12px;font-weight:700;color:var(--bluedark);opacity:.6;margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em;}
.field input{width:100%;padding:12px 14px;border:1.5px solid rgba(18,85,204,0.2);border-radius:10px;font-size:14px;font-family:inherit;color:var(--bluedark);outline:none;transition:.2s;}
.field input:focus{border-color:var(--blue);}
.btn{width:100%;padding:13px;background:linear-gradient(135deg,var(--blue),var(--bluedark));color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:4px;transition:.2s;}
.btn:hover{opacity:.9;}
.btn:disabled{opacity:.6;cursor:not-allowed;}
.error{background:#fff0f0;border:1px solid rgba(200,0,0,0.2);border-radius:8px;padding:10px 14px;font-size:13px;color:#c0392b;margin-bottom:14px;display:none;}
.error.show{display:block;}
.lock{text-align:center;font-size:40px;margin-bottom:16px;}
</style>
</head>
<body>
<div class="box">
  <div class="lock">🔐</div>
  <div class="logo">Spli<span>T</span>Pool</div>
  <div class="badge">ADMINISTRADOR</div>
  <div class="title">Acesso Restrito</div>
  <div class="sub">Painel exclusivo para administradores Splitpool</div>

  <div class="error" id="error-msg"></div>

  <div class="field">
    <label>Email</label>
    <input type="email" id="email" placeholder="admin@splitpool.com" autocomplete="off">
  </div>
  <div class="field">
    <label>Senha</label>
    <input type="password" id="senha" placeholder="••••••••" autocomplete="off">
  </div>
  <button class="btn" id="btn-login" onclick="entrar()">Acessar painel →</button>
</div>

<script>
const SBU='https://eawfweuamtwlsilrkgoo.supabase.co';
const SBK='sb_publishable_bqFMwjSFO3wczN7guuCx3w_UFKnF-gQ';
const sb=supabase.createClient(SBU,SBK);

// Verificar sessão admin no localStorage
(function(){
  try{
    var sess=JSON.parse(localStorage.getItem('sp_admin_sess')||'null');
    if(sess&&sess.email&&sess.exp>Date.now()){
      window.location.replace('dashboard-admin.html');
    }
  }catch(e){}
})();

document.getElementById('senha').addEventListener('keydown',function(e){
  if(e.key==='Enter') entrar();
});

// Hash SHA-256 simples via SubtleCrypto
async function sha256(msg){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(msg));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function entrar(){
  var email=document.getElementById('email').value.trim().toLowerCase();
  var senha=document.getElementById('senha').value;
  var btn=document.getElementById('btn-login');
  var err=document.getElementById('error-msg');
  err.classList.remove('show');

  if(!email||!senha){
    err.textContent='Preencha email e senha.';
    err.classList.add('show');
    return;
  }

  btn.disabled=true;btn.textContent='Verificando...';

  // Passo 1 - Autenticacao real via Supabase Auth (bcrypt + rate limit do proprio Supabase)
  var {data:authData,error:authErr}=await sb.auth.signInWithPassword({email:email,password:senha});
  if(authErr||!authData||!authData.session){
    err.textContent='Email ou senha incorretos.';
    err.classList.add('show');
    btn.disabled=false;btn.textContent='Acessar painel →';
    return;
  }

  // Passo 2 - A conta autenticada precisa estar na tabela admins e ativa
  var {data:ehAdmin,error:admErr}=await sb.rpc('is_admin');
  if(admErr||!ehAdmin){
    await sb.auth.signOut();
    err.textContent='Esta conta não tem permissão de administrador.';
    err.classList.add('show');
    btn.disabled=false;btn.textContent='Acessar painel →';
    return;
  }

  // Passo 3 - Guarda dados de exibicao (a sessao real e a do Supabase, nao esta)
  var sess={email:email,nome:'Admin',exp:Date.now()+8*60*60*1000};
  localStorage.setItem('sp_admin_sess',JSON.stringify(sess));
  window.location.replace('dashboard-admin.html');
}
</script>
</body>
</html>
