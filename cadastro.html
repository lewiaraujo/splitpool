/* Overlay sutil para profundidade */
.pool-overlay{
  position:fixed;inset:0;z-index:1;
  background: linear-gradient(
    180deg,
    rgba(180,235,245,0.10) 0%,
    rgba(0,160,200,0.06) 60%,
    rgba(0,120,170,0.15) 100%
  );
}

/* reflexos de luz na água */
.pool-overlay::before{
  content:'';position:absolute;
  top:8%;left:5%;width:280px;height:90px;
  background:rgba(255,255,255,0.18);
  border-radius:50%;transform:rotate(-15deg);
  filter:blur(12px);
}
.pool-overlay::after{
  content:'';position:absolute;
  top:35%;right:8%;width:200px;height:70px;
  background:rgba(255,255,255,0.13);
  border-radius:50%;transform:rotate(20deg);
  filter:blur(10px);
}

.page{position:relative;z-index:10;width:100%;max-width:420px;}

.logo-wrap{display:flex;justify-content:center;margin-bottom:1.25rem;}
.logo-wrap img{
  height:70px;object-fit:contain;
  background:rgba(255,255,255,0.9);
  padding:8px 22px;border-radius:12px;
  box-shadow:0 4px 20px rgba(0,0,0,0.12);
}

.card{
  background:rgba(255,255,255,0.90);
  backdrop-filter:blur(16px);
  border-radius:20px;
  padding:2rem;
  box-shadow:0 8px 40px rgba(0,30,80,0.18);
  border:1px solid rgba(255,255,255,0.6);
}
.card-title{font-size:22px;font-weight:800;text-align:center;color:#0A3080;margin-bottom:4px;}
.card-sub{text-align:center;font-size:14px;color:#5580B0;margin-bottom:1.5rem;}

.form{display:flex;flex-direction:column;gap:12px;margin-bottom:16px;}
input[type=email],input[type=password]{
  width:100%;padding:13px 16px;border-radius:10px;font-size:14px;
  outline:none;font-family:inherit;
  background:#F0F6FF;
  border:1.5px solid rgba(0,180,210,0.35);
  color:#0A3080;transition:.2s;
}
input:focus{border-color:#1255CC;}
input::placeholder{color:#8BAAC8;}

.btn-primary{
  width:100%;padding:14px;border-radius:10px;
  font-weight:700;color:#fff;font-size:15px;
  border:none;cursor:pointer;font-family:inherit;
  background:linear-gradient(135deg,#1255CC,#0A3080);
  box-shadow:0 4px 18px rgba(18,85,204,0.4);
  transition:.2s;
}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(18,85,204,0.5);}
.btn-primary:disabled{background:#93C5FD;cursor:not-allowed;transform:none;}

.divider{display:flex;align-items:center;gap:10px;margin:4px 0 14px;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(0,180,210,0.2);}
.divider span{font-size:12px;color:#5580B0;}

.btn-google{
  width:100%;display:flex;align-items:center;justify-content:center;gap:10px;
  padding:13px;border-radius:10px;font-size:14px;font-weight:600;
  background:#fff;border:1.5px solid rgba(0,0,0,0.1);color:#0A3080;
  cursor:pointer;font-family:inherit;margin-bottom:16px;transition:.2s;
}
.btn-google:hover{background:#F0F6FF;border-color:rgba(0,180,210,0.4);}

.toggle-row{text-align:center;font-size:14px;color:#5580B0;}
.toggle-row button{
  font-weight:700;color:#1255CC;background:none;border:none;cursor:pointer;font-family:inherit;font-size:14px;
}

.msg{
  padding:10px 14px;border-radius:10px;font-size:13px;
  margin-bottom:14px;text-align:center;display:none;
}
.msg.success{background:#D1FAE5;color:#065F46;}
.msg.error{background:#FEE2E2;color:#991B1B;}

.terms{text-align:center;font-size:11px;color:#8BAAC8;margin-top:12px;}
.terms a{color:#1255CC;text-decoration:none;}

.back{text-align:center;margin-top:16px;}
.back a{
  font-size:14px;font-weight:700;color:#0A3080;text-decoration:none;
  text-shadow:0 1px 6px rgba(255,255,255,0.8);
}
.back a:hover{text-decoration:underline;}
</style>
</head>
<body>

<div class="pool-bg"></div>
<div class="pool-overlay"></div>

<div class="page">
  <div class="logo-wrap">
    <img src="https://raw.githubusercontent.com/lewiaraujo/splitpool/main/SplitPool_nome%20completo.png" alt="SplitPool">
  </div>

  <div class="card">
    <div class="card-title" id="card-title">Criar uma conta</div>
    <div class="card-sub" id="card-sub">Comece a economizar hoje</div>

    <div class="msg" id="msg"></div>

    <form class="form" id="form" onsubmit="handleAuth(event)">
      <input type="email" id="email" placeholder="seu@email.com" required>
      <input type="password" id="password" placeholder="Senha (mínimo 6 caracteres)" required minlength="6">
      <button type="submit" class="btn-primary" id="btn-submit">Criar conta</button>
    </form>

    <div class="divider"><span>ou</span></div>

    <button class="btn-google" onclick="handleGoogle()">
      <svg width="18" height="18" viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Continuar com Google
    </button>

    <div class="toggle-row">
      <span id="toggle-text">Já tem conta? </span>
      <button onclick="toggleMode()"><span id="toggle-btn">Entrar</span></button>
    </div>

    <div class="toggle-row" id="forgot-row" style="margin-top:8px;display:none;">
      <button onclick="toggleForgot()">Esqueci minha senha</button>
    </div>

    <!-- PAINEL RECUPERAÇÃO DE SENHA -->
    <div id="forgot-panel" style="display:none;margin-top:14px;">
      <div style="font-size:13px;color:#5580B0;margin-bottom:10px;text-align:center;line-height:1.6;">
        Digite seu e-mail e enviaremos um link para redefinir sua senha.
      </div>
      <input type="email" id="forgot-email" placeholder="seu@email.com" style="width:100%;padding:13px 16px;border-radius:10px;font-size:14px;outline:none;font-family:inherit;background:#F0F6FF;border:1.5px solid rgba(0,180,210,0.35);color:#0A3080;margin-bottom:10px;">
      <button class="btn-primary" onclick="enviarReset()">Enviar link de recuperação</button>
      <div style="text-align:center;margin-top:10px;">
        <button onclick="toggleForgot()" style="font-size:13px;color:#1255CC;background:none;border:none;cursor:pointer;font-family:inherit;font-weight:600;">← Voltar ao login</button>
      </div>
    </div>

    <div class="terms">
      Ao continuar, você concorda com os
      <a href="/termos">Termos</a> e a
      <a href="/privacidade">Política de Privacidade</a>
    </div>
  </div>

  <div class="back">
    <a href="/">← Voltar para o início</a>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://eawfweuamtwlsilrkgoo.supabase.co'
  const SUPABASE_KEY = 'sb_publishable_bqFMwjSFO3wczN7guuCx3w_UFKnF-gQ'
  const { createClient } = supabase
  const sb = createClient(SUPABASE_URL, SUPABASE_KEY)

  let isLogin = false

  function toggleMode() {
    isLogin = !isLogin
    document.getElementById('card-title').textContent = isLogin ? 'Entrar na conta' : 'Criar uma conta'
    document.getElementById('card-sub').textContent = isLogin ? 'Bem-vindo de volta!' : 'Comece a economizar hoje'
    document.getElementById('btn-submit').textContent = isLogin ? 'Entrar' : 'Criar conta'
    document.getElementById('toggle-text').textContent = isLogin ? 'Não tem conta? ' : 'Já tem conta? '
    document.getElementById('toggle-btn').textContent = isLogin ? 'Criar conta' : 'Entrar'
    document.getElementById('forgot-row').style.display = isLogin ? 'block' : 'none'
    document.getElementById('forgot-panel').style.display = 'none'
    document.getElementById('form').style.display = 'flex'
    hideMsg()
  }

  function toggleForgot() {
    const panel = document.getElementById('forgot-panel')
    const form = document.getElementById('form')
    const showing = panel.style.display !== 'none'
    panel.style.display = showing ? 'none' : 'block'
    form.style.display = showing ? 'flex' : 'none'
    document.getElementById('forgot-email').value = document.getElementById('email').value || ''
    hideMsg()
  }

  async function enviarReset() {
    const email = document.getElementById('forgot-email').value.trim()
    if (!email) { showMsg('Digite seu e-mail.', 'error'); return }
    const { error } = await sb.auth.resetPasswordForEmail(email, {
      redirectTo: 'https://lewiaraujo.github.io/splitpool/cadastro.html'
    })
    if (error) showMsg(error.message, 'error')
    else showMsg('✅ Link enviado! Verifique seu e-mail.', 'success')
  }

  function showMsg(text, type) {
    const el = document.getElementById('msg')
    el.textContent = text
    el.className = 'msg ' + type
    el.style.display = 'block'
  }

  function hideMsg() {
    document.getElementById('msg').style.display = 'none'
  }

  async function handleAuth(e) {
    e.preventDefault()
    const email = document.getElementById('email').value
    const password = document.getElementById('password').value
    const btn = document.getElementById('btn-submit')
    btn.disabled = true
    btn.textContent = 'Carregando...'
    hideMsg()

    if (isLogin) {
      const { error } = await sb.auth.signInWithPassword({ email, password })
      if (error) {
        if (error.message.includes('Invalid login credentials')) showMsg('E-mail ou senha incorretos.', 'error')
        else showMsg(error.message, 'error')
      }
      else window.location.href = '/splitpool/explorar.html'
    } else {
      // Verificar se email já existe tentando login com senha errada
      const { data: existing } = await sb.from('profiles').select('id').eq('email', email).limit(1)
      if (existing && existing.length > 0) {
        showMsg('Este e-mail já está cadastrado. Clique em "Entrar".', 'error')
        btn.disabled = false
        btn.textContent = 'Criar conta'
        return
      }
      const { error } = await sb.auth.signUp({ email, password })
      if (error) {
        if (error.message.includes('already registered')) showMsg('Este e-mail já está cadastrado. Clique em "Entrar".', 'error')
        else showMsg(error.message, 'error')
      }
      else showMsg('✅ Conta criada! Verifique seu e-mail para confirmar.', 'success')
    }

    btn.disabled = false
    btn.textContent = isLogin ? 'Entrar' : 'Criar conta'
  }

  async function handleGoogle() {
    const { error } = await sb.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: window.location.origin + '/splitpool/explorar.html' }
    })
    if (error) showMsg(error.message, 'error')
  }

  sb.auth.getSession().then(({ data }) => {
    if (data.session) window.location.href = '/splitpool/explorar.html'
  })

  // Detectar link de reset de senha
  sb.auth.onAuthStateChange((event) => {
    if (event === 'PASSWORD_RECOVERY') {
      document.getElementById('card-title').textContent = 'Redefinir senha'
      document.getElementById('card-sub').textContent = 'Digite sua nova senha'
      document.getElementById('form').innerHTML = `
        <input type="password" id="new-password" placeholder="Nova senha (mínimo 6 caracteres)" required minlength="6">
        <button type="submit" class="btn-primary">Salvar nova senha</button>
      `
      document.getElementById('form').onsubmit = async function(e) {
        e.preventDefault()
        const newPass = document.getElementById('new-password').value
        const { error } = await sb.auth.updateUser({ password: newPass })
        if (error) showMsg(error.message, 'error')
        else {
          showMsg('✅ Senha atualizada! Redirecionando...', 'success')
          setTimeout(() => window.location.href = '/splitpool/explorar.html', 2000)
        }
      }
      document.getElementById('forgot-row').style.display = 'none'
      document.getElementById('btn-google').style.display = 'none'
      document.getElementById('toggle-row').style.display = 'none'
    }
  })
</script>
</body>
</html>
