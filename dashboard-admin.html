<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Splitpool — Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Nunito:wght@700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
:root{--teal:#00C8D7;--blue:#1255CC;--bluedark:#0A3080;--green:#00A878;--text:#0C2461;--red:#e74c3c;}
body{font-family:'Inter',sans-serif;color:var(--text);background:#f0f6ff;min-height:100vh;}
nav{background:#fff;border-bottom:1px solid rgba(18,85,204,0.15);padding:0 5%;position:sticky;top:0;z-index:100;}
.nav-in{max-width:1100px;margin:0 auto;height:60px;display:flex;align-items:center;justify-content:space-between;}
.nav-logo{font-family:'Nunito',sans-serif;font-size:20px;font-weight:900;color:var(--blue);}
.nav-badge{background:#e74c3c;color:#fff;font-size:10px;font-weight:800;padding:2px 8px;border-radius:10px;margin-left:8px;}
.nav-right{display:flex;gap:10px;align-items:center;}
.nav-btn{font-size:13px;font-weight:600;color:var(--blue);background:transparent;border:1px solid rgba(18,85,204,0.2);border-radius:7px;padding:6px 14px;cursor:pointer;font-family:inherit;text-decoration:none;}
.wrap{max-width:1100px;margin:0 auto;padding:32px 5% 60px;}
.page-title{font-family:'Nunito',sans-serif;font-size:24px;font-weight:900;color:var(--bluedark);margin-bottom:4px;}
.page-sub{font-size:13px;color:var(--bluedark);opacity:.5;margin-bottom:24px;}
.resumo{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:28px;}
.rcard{background:#fff;border-radius:12px;padding:16px 18px;border:1px solid rgba(0,180,210,0.15);}
.rcard-val{font-family:'Nunito',sans-serif;font-size:26px;font-weight:900;color:var(--bluedark);}
.rcard-val.green{color:var(--green);}
.rcard-val.blue{color:var(--blue);}
.rcard-val.red{color:var(--red);}
.rcard-lbl{font-size:11px;color:var(--bluedark);opacity:.45;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-top:2px;}
.section-title{font-size:13px;font-weight:700;color:var(--bluedark);opacity:.5;text-transform:uppercase;letter-spacing:.07em;margin-bottom:12px;}
.filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.filter-btn{padding:6px 14px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid rgba(18,85,204,0.2);background:#fff;color:var(--bluedark);transition:.15s;}
.filter-btn.act{background:var(--blue);color:#fff;border-color:var(--blue);}
.table-wrap{background:#fff;border-radius:14px;border:1px solid rgba(0,180,210,0.15);overflow:hidden;}
table{width:100%;border-collapse:collapse;}
thead th{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--bluedark);opacity:.4;padding:12px 16px;text-align:left;border-bottom:1px solid rgba(0,180,210,0.1);}
tbody tr{border-bottom:1px solid rgba(0,180,210,0.07);transition:.15s;}
tbody tr:hover{background:#f5f9ff;}
tbody td{padding:12px 16px;font-size:13px;color:var(--bluedark);}
.status-pill{display:inline-block;padding:3px 10px;border-radius:6px;font-size:11px;font-weight:700;}
.status-pill.pendente{background:#fff8e0;color:#8a5c00;}
.status-pill.aprovado{background:#e0f0ff;color:#0A3080;}
.status-pill.pago{background:#e6fff8;color:#00522a;}
.tipo-pill{display:inline-block;padding:3px 9px;border-radius:6px;font-size:11px;font-weight:600;}
.tipo-pill.custo{background:#e6f0ff;color:#1255CC;}
.tipo-pill.margem{background:#e6fff8;color:#00875A;}
.btn-aprovar{background:var(--blue);color:#fff;border:none;padding:5px 12px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn-aprovar:hover{background:var(--bluedark);}
.btn-pago{background:var(--green);color:#fff;border:none;padding:5px 12px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn-pago:hover{opacity:.85;}
.btn-export{background:var(--green);color:#fff;border:none;padding:8px 18px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--bluedark);color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:500;transition:transform .3s ease;white-space:normal;max-width:calc(100vw - 32px);text-align:center;}
.toast.show{transform:translateX(-50%) translateY(0);}
.toast.success{background:#00875A;}
.toast.error{background:#c0392b;}
.empty{text-align:center;padding:40px;color:var(--bluedark);opacity:.4;font-size:14px;}
.spinner{width:32px;height:32px;border:3px solid rgba(18,85,204,0.15);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:40px auto;}
@keyframes spin{to{transform:rotate(360deg);}}
@media(max-width:680px){
  thead{display:none;}
  table,tbody,tr,td{display:block;width:100%;}
  tr{padding:12px 16px;border-bottom:1px solid rgba(0,180,210,0.1);}
  td{padding:3px 0;border:none;font-size:13px;}
  td[data-label]::before{content:attr(data-label);display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;color:var(--bluedark);opacity:.4;margin-right:8px;}
}
</style>
</head>
<body>

<nav>
  <div class="nav-in">
    <div class="nav-logo">Spli<span style="color:var(--teal);">T</span>Pool <span class="nav-badge">ADMIN</span></div>
    <div class="nav-right">
      <a href="dashboard-owner.html" class="nav-btn">Dashboard dono</a>
      <a href="explorar.html" class="nav-btn">Explorar</a>
      <button class="nav-btn" onclick="sair()">Sair</button>
    </div>
  </div>
</nav>

<div class="wrap">
  <div class="page-title">Painel Administrativo</div>
  <div class="page-sub">Visão financeira completa · Repasses e saques</div>

  <div class="resumo" id="resumo-admin">
    <div class="spinner"></div>
  </div>

  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px;">
    <div class="section-title" style="margin:0;">Repasses</div>
    <button class="btn-export" onclick="exportarCSV()">⬇ Exportar CSV</button>
  </div>

  <div class="filters" id="filtros">
    <div class="filter-btn act" onclick="filtrar('todos',this)">Todos</div>
    <div class="filter-btn" onclick="filtrar('pendente',this)">Pendentes</div>
    <div class="filter-btn" onclick="filtrar('aprovado',this)">Aprovados</div>
    <div class="filter-btn" onclick="filtrar('pago',this)">Pagos</div>
    <div class="filter-btn" onclick="filtrar('custo',this)">Tipo: Custo</div>
    <div class="filter-btn" onclick="filtrar('margem',this)">Tipo: Margem</div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Dono</th>
          <th>Serviço</th>
          <th>Mês</th>
          <th>Tipo</th>
          <th>Valor</th>
          <th>Status</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="tabela-body">
        <tr><td colspan="7"><div class="spinner"></div></td></tr>
      </tbody>
    </table>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SBU='https://eawfweuamtwlsilrkgoo.supabase.co';
const SBK='sb_publishable_bqFMwjSFO3wczN7guuCx3w_UFKnF-gQ';
const ADMIN_ID='d30eb11b-baf1-4abe-b122-f5c9e181d1eb';
const sb=supabase.createClient(SBU,SBK);

var todosRepasses=[];
var filtroAtual='todos';
var mesesLabel={'01':'Jan','02':'Fev','03':'Mar','04':'Abr','05':'Mai','06':'Jun','07':'Jul','08':'Ago','09':'Set','10':'Out','11':'Nov','12':'Dez'};

function fmt(v){return'R$'+Number(v).toFixed(2).replace('.',',');}
function formatMes(m){var p=m.split('-');return(mesesLabel[p[1]]||p[1])+'/'+p[0];}

function showToast(msg,tipo){
  var t=document.getElementById('toast');
  t.textContent=msg;
  t.className='toast show '+(tipo||'');
  setTimeout(function(){t.className='toast';},3500);
}

async function init(){
  var {data:sess}=await sb.auth.getSession();
  if(!sess.session){window.location.href='cadastro.html';return;}
  if(sess.session.user.id!==ADMIN_ID){
    alert('Acesso restrito ao administrador.');
    window.location.href='explorar.html';
    return;
  }
  await carregarDados();
}

async function carregarDados(){
  // Buscar todos os repasses
  var {data:repasses}=await sb.from('repasses')
    .select('*')
    .order('mes_referencia',{ascending:false})
    .order('created_at',{ascending:false});
  todosRepasses=repasses||[];

  // Buscar perfis dos donos
  var donoIds=[...new Set(todosRepasses.map(function(r){return r.dono_id;}))];
  var perfisMap={};
  if(donoIds.length){
    var {data:perfis}=await sb.from('profiles').select('id,nome,email').in('id',donoIds);
    (perfis||[]).forEach(function(p){perfisMap[p.id]=p;});
  }

  // Buscar piscinas
  var piscIds=[...new Set(todosRepasses.map(function(r){return r.piscina_id;}))];
  var piscMap={};
  if(piscIds.length){
    var {data:piscs}=await sb.from('piscinas').select('id,servico').in('id',piscIds);
    (piscs||[]).forEach(function(p){piscMap[p.id]=p;});
  }

  // Enriquecer repasses
  todosRepasses=todosRepasses.map(function(r){
    r._perfil=perfisMap[r.dono_id]||{nome:'—',email:'—'};
    r._piscina=piscMap[r.piscina_id]||{servico:'—'};
    return r;
  });

  renderResumo();
  renderTabela();
}

function renderResumo(){
  var total=todosRepasses.reduce(function(s,r){return s+Number(r.valor||0);},0);
  var pendente=todosRepasses.filter(function(r){return r.status==='pendente';}).reduce(function(s,r){return s+Number(r.valor||0);},0);
  var aprovado=todosRepasses.filter(function(r){return r.status==='aprovado';}).reduce(function(s,r){return s+Number(r.valor||0);},0);
  var pago=todosRepasses.filter(function(r){return r.status==='pago';}).reduce(function(s,r){return s+Number(r.valor||0);},0);
  var nDonos=new Set(todosRepasses.map(function(r){return r.dono_id;})).size;

  document.getElementById('resumo-admin').innerHTML=
    '<div class="rcard"><div class="rcard-val blue">'+fmt(total)+'</div><div class="rcard-lbl">Total gerado</div></div>'+
    '<div class="rcard"><div class="rcard-val red">'+fmt(pendente)+'</div><div class="rcard-lbl">A pagar</div></div>'+
    '<div class="rcard"><div class="rcard-val blue">'+fmt(aprovado)+'</div><div class="rcard-lbl">Aprovados</div></div>'+
    '<div class="rcard"><div class="rcard-val green">'+fmt(pago)+'</div><div class="rcard-lbl">Pagos</div></div>'+
    '<div class="rcard"><div class="rcard-val">'+nDonos+'</div><div class="rcard-lbl">Donos ativos</div></div>'+
    '<div class="rcard"><div class="rcard-val">'+todosRepasses.length+'</div><div class="rcard-lbl">Repasses totais</div></div>';
}

function filtrar(f,el){
  filtroAtual=f;
  document.querySelectorAll('.filter-btn').forEach(function(b){b.classList.remove('act');});
  if(el) el.classList.add('act');
  renderTabela();
}

function renderTabela(){
  var lista=todosRepasses.filter(function(r){
    if(filtroAtual==='todos') return true;
    if(filtroAtual==='custo'||filtroAtual==='margem') return r.tipo===filtroAtual;
    return r.status===filtroAtual;
  });

  if(!lista.length){
    document.getElementById('tabela-body').innerHTML='<tr><td colspan="7"><div class="empty">Nenhum repasse encontrado.</div></td></tr>';
    return;
  }

  var html=lista.map(function(r){
    var nome=r._perfil.nome||r._perfil.email||'—';
    var servico=r._piscina.servico||'—';
    var acoes='';
    if(r.status==='pendente') acoes='<button class="btn-aprovar" onclick="aprovar(\''+r.id+'\')">Aprovar</button>';
    if(r.status==='aprovado') acoes='<button class="btn-pago" onclick="marcarPago(\''+r.id+'\')">Marcar pago</button>';
    if(r.status==='pago') acoes='<span style="color:var(--green);font-size:12px;font-weight:700;">✓ Pago</span>';

    return '<tr>'+
      '<td data-label="Dono">'+nome+'</td>'+
      '<td data-label="Serviço">'+servico+'</td>'+
      '<td data-label="Mês">'+formatMes(r.mes_referencia)+'</td>'+
      '<td data-label="Tipo"><span class="tipo-pill '+r.tipo+'">'+r.tipo+'</span></td>'+
      '<td data-label="Valor" style="font-weight:700;color:var(--green);">'+fmt(r.valor)+'</td>'+
      '<td data-label="Status"><span class="status-pill '+r.status+'">'+r.status+'</span></td>'+
      '<td data-label="Ação">'+acoes+'</td>'+
      '</tr>';
  }).join('');

  document.getElementById('tabela-body').innerHTML=html;
}

async function aprovar(id){
  var {error}=await sb.from('repasses').update({status:'aprovado'}).eq('id',id);
  if(error){showToast('Erro: '+error.message,'error');return;}
  showToast('Repasse aprovado!','success');
  await carregarDados();
}

async function marcarPago(id){
  var {error}=await sb.from('repasses').update({status:'pago',pago_em:new Date().toISOString()}).eq('id',id);
  if(error){showToast('Erro: '+error.message,'error');return;}
  showToast('Repasse marcado como pago!','success');
  await carregarDados();
}

function exportarCSV(){
  var lista=todosRepasses;
  var cabecalho='Dono,Email,Serviço,Mês,Tipo,Valor,Status,Pago em\n';
  var linhas=lista.map(function(r){
    return [
      r._perfil.nome||'—',
      r._perfil.email||'—',
      r._piscina.servico||'—',
      formatMes(r.mes_referencia),
      r.tipo,
      Number(r.valor).toFixed(2),
      r.status,
      r.pago_em?new Date(r.pago_em).toLocaleDateString('pt-BR'):'—'
    ].join(',');
  }).join('\n');
  var blob=new Blob([cabecalho+linhas],{type:'text/csv;charset=utf-8;'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download='splitpool_repasses_'+getMesAtual()+'.csv';
  a.click();URL.revokeObjectURL(url);
  showToast('CSV exportado!','success');
}

function getMesAtual(){
  var d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}

function sair(){sb.auth.signOut().then(function(){window.location.href='index.html';});}

init();
</script>
</body>
</html>
